name: 'yq - portable yaml processor'
author: 'step-security'
description: 'create, read, update, delete, merge, validate and do more with yaml'
branding:
  icon: command
  color: gray-dark
inputs:
  cmd:
    description: 'The Command which should be run'
    required: true
outputs:
  result:
    description: "The complete result from the yq command being run"
runs:
  using: 'docker'
  image: 'docker://ghcr.io/step-security/mikefarah-yq:v4.53.3@sha256:5c311bed16c3cb5afa4e889013e5b5b25614f4ce3e8d4335e84481a60e4c549d' # v4.53.3
  args:
    - ${{ inputs.cmd }}
