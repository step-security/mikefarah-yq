name: 'yq - portable yaml processor'
author: 'step-security'
description: 'create, read, update, delete, merge, validate and do more with yaml'
branding:
  icon: command
  color: gray-dark
inputs:
  cmd:
    description: 'The Command which should be run'
    required: true
outputs:
  result:
    description: "The complete result from the yq command being run"
runs:
  using: 'docker'
  image: 'docker://ghcr.io/step-security/mikefarah-yq:v4.52.5@sha256:d2cee151e97c7697a7be53f6ffbfd50b15a785f1e6a289510429279dd7cc1c95' # v4.52.5
  args:
    - ${{ inputs.cmd }}
